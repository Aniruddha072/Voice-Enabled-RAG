[project]
name = "voicerag"
version = "0.1.0"
description = "Voice-in, grounded-answer-out RAG over Hindi and English MS MARCO passages."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.25",
    "pandas>=2.0",
    "pyarrow>=17.0",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.10",
    "torch>=2.5",
    "sarvamai>=0.1.30",
    "faster-whisper>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
